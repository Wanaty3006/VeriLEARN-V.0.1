<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriLearn — Video QA</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a18;min-height:100vh;padding:24px 16px}
  textarea,input[type=text],input[type=password]{width:100%;border:0.5px solid #d3d1c7;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s}
  textarea:focus,input:focus{border-color:#888}
  button{border:0.5px solid #d3d1c7;border-radius:8px;padding:6px 13px;font-size:12px;font-family:inherit;background:#fff;color:#1a1a18;cursor:pointer;transition:all .15s}
  button:hover:not(:disabled){background:#f1efe8}
  button.primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
  button.primary:hover:not(:disabled){background:#333}
  button:disabled{opacity:.4;cursor:default}
  .card{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:16px}
  .metric{background:#f1efe8;border-radius:8px;padding:10px 12px}
  .mono{font-family:'Courier New',monospace}
  a{color:#185fa5;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef} = React;

const RULES=[
  {id:"spelling", label:"ตรวจคำผิด / สะกดผิด",   enabled:true},
  {id:"content",  label:"เนื้อหาตรงกับ Script",    enabled:true},
  {id:"complete", label:"เนื้อหาครบถ้วน",          enabled:true},
  {id:"structure",label:"โครงสร้างการนำเสนอ",      enabled:true},
  {id:"bad",      label:"เนื้อหาไม่เหมาะสม",       enabled:false},
];

const ASMB="https://api.assemblyai.com";

function Toggle({on,onChange}){
  return <div onClick={onChange} style={{width:32,height:18,borderRadius:9,background:on?"#1D9E75":"#b4b2a9",position:"relative",cursor:"pointer",flexShrink:0,transition:"background .2s"}}>
    <div style={{position:"absolute",top:2,left:on?14:2,width:14,height:14,borderRadius:"50%",background:"#fff",transition:"left .2s"}}/>
  </div>;
}

function fmtSec(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")},000`;
}
function msToMmss(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),sc=s%60;return `${m}:${String(sc).padStart(2,"0")}`;}
function tsToSec(ts="0:00"){const p=ts.trim().split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+(p[1]||0);}

function App(){
  const [asmKey,setAsmKey]=useState("");
  const [antKey,setAntKey]=useState("");
  const [showKeys,setShowKeys]=useState(false);
  const [step,setStep]=useState(1);
  const [file,setFile]=useState(null);
  const [script,setScript]=useState("");
  const [rules,setRules]=useState(RULES);
  const [phase,setPhase]=useState(0);
  const [progress,setProgress]=useState(0);
  const [status,setStatus]=useState("");
  const [transcript,setTranscript]=useState("");
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [activeTab,setActiveTab]=useState("report");
  const fileRef=useRef();
  const abortRef=useRef(false);

  const toggleRule=id=>setRules(r=>r.map(x=>x.id===id?{...x,enabled:!x.enabled}:x));

  const onFile=e=>{
    const f=e.target.files?.[0];
    if(!f) return;
    if(!f.type.startsWith("video/")&&!f.type.startsWith("audio/")){setError("รองรับเฉพาะ Video หรือ Audio เท่านั้น");return;}
    setFile(f);setError("");
  };

  const run=async()=>{
    if(!asmKey.trim()){setError("กรุณาใส่ AssemblyAI API Key");return;}
    if(!antKey.trim()){setError("กรุณาใส่ Anthropic API Key");return;}
    if(!file){setError("กรุณาเลือกไฟล์ก่อน");return;}
    setError("");setResult(null);setTranscript("");abortRef.current=false;

    try{
      // Phase 1: Upload
      setPhase(1);setProgress(5);setStatus("กำลังอัปโหลดไฟล์...");
      const uploadRes=await fetch(`${ASMB}/v2/upload`,{
        method:"POST",
        headers:{"Authorization":asmKey.trim(),"Content-Type":"application/octet-stream"},
        body:file
      });
      if(!uploadRes.ok){const e=await uploadRes.json().catch(()=>({}));throw new Error(`Upload Error ${uploadRes.status}: ${e?.error||uploadRes.statusText}`);}
      const {upload_url}=await uploadRes.json();
      if(abortRef.current) return;

      // Phase 2: Request transcription
      setPhase(2);setProgress(15);setStatus("เริ่มถอดเสียงภาษาไทย...");
      const txRes=await fetch(`${ASMB}/v2/transcript`,{
        method:"POST",
        headers:{"Authorization":asmKey.trim(),"Content-Type":"application/json"},
        body:JSON.stringify({audio_url:upload_url,speech_models:["universal-2"],language_code:"th",punctuate:true,format_text:true})
      });
      if(!txRes.ok){const e=await txRes.json().catch(()=>({}));throw new Error(`Transcription Error ${txRes.status}: ${e?.error||txRes.statusText}`);}
      const {id:txId}=await txRes.json();

      // Phase 2: Poll
      let txData=null,poll=0;
      while(true){
        if(abortRef.current) return;
        await new Promise(r=>setTimeout(r,3000));
        poll++;
        const p=await fetch(`${ASMB}/v2/transcript/${txId}`,{headers:{"Authorization":asmKey.trim()}});
        txData=await p.json();
        setProgress(Math.min(15+poll*7,78));
        if(txData.status==="completed") break;
        if(txData.status==="error") throw new Error("AssemblyAI: "+txData.error);
        setStatus(`กำลังถอดเสียง... (${txData.status})`);
      }

      // Build transcript
      let txText="";
      if(txData.utterances?.length){
        txText=txData.utterances.map(u=>`${msToMmss(u.start)} ${u.text}`).join("\n");
      } else if(txData.words?.length){
        const chunks=[];let chunk=[],cs=0;
        txData.words.forEach((w,i)=>{
          if(!chunk.length) cs=w.start;
          chunk.push(w.text);
          if(chunk.length>=15||i===txData.words.length-1){chunks.push({start:cs,text:chunk.join(" ")});chunk=[];}
        });
        txText=chunks.map(c=>`${msToMmss(c.start)} ${c.text}`).join("\n");
      } else { txText=txData.text||""; }
      setTranscript(txText);
      if(abortRef.current) return;

      // Phase 3: Claude
      setPhase(3);setProgress(82);setStatus("ถอดเสียงเสร็จแล้ว กำลังวิเคราะห์ด้วย Claude...");
      const enabled=rules.filter(r=>r.enabled).map(r=>r.label).join(", ");
      const prompt=`คุณคือ AI ระบบตรวจสอบคุณภาพสื่อ E-Learning ภาษาไทย

Transcript จาก Video (ถอดเสียงโดย AssemblyAI):
${txText}

${script.trim()?`Script ต้นฉบับ:\n${script}`:"ไม่มี Script ต้นฉบับ"}

Checklist: ${enabled}

วิเคราะห์แล้วตอบเป็น JSON เท่านั้น ห้ามมี markdown:
{"score":<0-100>,"summary":"<สรุป>","issues":[{"timestamp":"<MM:SS>","type":"<คำผิด|เนื้อหา|โครงสร้าง|ข้อมูลผิด|เนื้อหาขาด>","severity":"<critical|warning|info>","description":"<ปัญหา>","suggestion":"<แนะนำ>"}],"passed":["<ผ่าน>"],"stats":{"total_issues":<n>,"critical":<n>,"warning":<n>,"info":<n>}}`;

      const cRes=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":antKey.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:prompt}]})
      });
      if(!cRes.ok){const e=await cRes.json().catch(()=>({}));throw new Error(`Claude ${cRes.status}: ${e?.error?.message||cRes.statusText}`);}
      const cData=await cRes.json();
      const raw=(cData.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
      const m=raw.match(/\{[\s\S]*\}/);
      if(!m) throw new Error("ไม่พบ JSON ในผลลัพธ์");
      const parsed=JSON.parse(m[0]);
      if(!parsed.issues||parsed.score===undefined) throw new Error("ข้อมูลไม่ครบ");
      setResult(parsed);setPhase(4);setProgress(100);setStatus("");setStep(3);
    } catch(e){
      if(!abortRef.current) setError(e.message);
      setPhase(0);setProgress(0);setStatus("");
    }
  };

  const stop=()=>{abortRef.current=true;setPhase(0);setProgress(0);setStatus("");setError("หยุดการประมวลผล");};

  const downloadSrt=()=>{
    const lines=(result?.issues||[]).map((iss,i)=>{const s=tsToSec(iss.timestamp),e=s+4;return `${i+1}\n${fmtSec(s)} --> ${fmtSec(e)}\n[${iss.type}] ${iss.description}`;});
    const blob=new Blob([lines.join("\n\n")],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="verilearn_markers.srt";a.click();URL.revokeObjectURL(url);
  };

  const loading=phase>0&&phase<4;
  const PHASE_LBL=["","อัปโหลดไฟล์","ถอดเสียง","วิเคราะห์","เสร็จสิ้น"];
  const scoreBg=result?(result.score>=80?"#eaf3de":result.score>=60?"#faeeda":"#fcebeb"):"#f1efe8";
  const scoreColor=result?(result.score>=80?"#27500a":result.score>=60?"#633806":"#791f1f"):"#888";

  return(
    <div style={{maxWidth:740,margin:"0 auto"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:"#5DCAA5"}}/>
          <span style={{fontSize:16,fontWeight:500}}>VeriLearn</span>
          <span style={{fontSize:10,background:"#e1f5ee",color:"#085041",padding:"1px 7px",borderRadius:10,fontWeight:500}}>v3 · Video</span>
        </div>
        <div style={{display:"flex",gap:6}}>
          {[["1 · อัปโหลด",1],["2 · Checklist",2],["3 · ผลลัพธ์",3]].map(([lbl,s])=>(
            <button key={s} onClick={()=>s<=step&&!loading&&setStep(s)} style={{fontSize:11,padding:"4px 12px",background:step===s?"#1a1a18":"transparent",color:step===s?"#fff":"#888",borderColor:step===s?"#1a1a18":"#d3d1c7",borderRadius:20,opacity:s>step?.4:1,cursor:s>step||loading?"default":"pointer"}}>{lbl}</button>
          ))}
        </div>
      </div>

      {/* API Keys */}
      <div className="card" style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:500,color:"#555"}}>API Keys</span>
          <button onClick={()=>setShowKeys(v=>!v)} style={{fontSize:10,padding:"2px 8px"}}>{showKeys?"ซ่อน":"แสดง"}</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div>
            <div style={{fontSize:10,color:"#888",marginBottom:4}}>AssemblyAI <span style={{background:"#e1f5ee",color:"#085041",padding:"0 4px",borderRadius:3}}>ถอดเสียง</span></div>
            <input type={showKeys?"text":"password"} value={asmKey} onChange={e=>setAsmKey(e.target.value)} placeholder="xxxxxxxxxxxxxxxxxxxxxxxx" className="mono"/>
          </div>
          <div>
            <div style={{fontSize:10,color:"#888",marginBottom:4}}>Anthropic <span style={{background:"#eeedfe",color:"#3c3489",padding:"0 4px",borderRadius:3}}>วิเคราะห์</span></div>
            <input type={showKeys?"text":"password"} value={antKey} onChange={e=>setAntKey(e.target.value)} placeholder="sk-ant-api03-..." className="mono"/>
          </div>
        </div>
        <div style={{display:"flex",gap:16,marginTop:8,fontSize:10,color:"#999"}}>
          <a href="https://www.assemblyai.com/dashboard/signup" target="_blank">ขอ AssemblyAI Key ↗ (Free 5 ชม.)</a>
          <a href="https://console.anthropic.com/settings/keys" target="_blank">ขอ Anthropic Key ↗</a>
          <span>* Keys ไม่ถูกบันทึก</span>
        </div>
      </div>

      {/* Step 1 */}
      {step===1&&(
        <div className="card">
          <p style={{fontSize:13,color:"#555",marginBottom:14}}>อัปโหลด Video หรือ Audio ที่ต้องการตรวจสอบ</p>
          <div onClick={()=>fileRef.current?.click()} style={{border:`1.5px dashed ${file?"#1D9E75":"#d3d1c7"}`,borderRadius:10,padding:"24px 16px",textAlign:"center",cursor:"pointer",background:file?"#e1f5ee":"#f8f8f6",marginBottom:12}}>
            <input ref={fileRef} type="file" accept="video/*,audio/*" onChange={onFile} style={{display:"none"}}/>
            {file?(
              <div>
                <div style={{width:30,height:30,borderRadius:"50%",background:"#1D9E75",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 7px"}}>
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 6.5l3 3 7-7" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
                <div style={{fontSize:13,fontWeight:500,color:"#085041"}}>{file.name}</div>
                <div style={{fontSize:11,color:"#0f6e56",marginTop:2}}>{(file.size/1024/1024).toFixed(1)} MB · คลิกเพื่อเปลี่ยน</div>
              </div>
            ):(
              <div>
                <div style={{fontSize:13,fontWeight:500,color:"#888",marginBottom:3}}>คลิกเพื่อเลือกไฟล์</div>
                <div style={{fontSize:11,color:"#aaa"}}>MP4, MOV, MP3, M4A, WAV — ไม่จำกัดขนาด</div>
              </div>
            )}
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"#888",marginBottom:4}}>Script ต้นฉบับ <span style={{background:"#e6f1fb",color:"#0c447c",padding:"0 5px",borderRadius:3,fontSize:10}}>แนะนำ</span></div>
            <textarea value={script} onChange={e=>setScript(e.target.value)} placeholder="วาง Script ต้นฉบับเพื่อให้ AI เปรียบเทียบได้แม่นยำขึ้น..." style={{height:70,lineHeight:1.6,fontFamily:"monospace",fontSize:12}}/>
          </div>
          {error&&<div style={{background:"#fcebeb",color:"#791f1f",fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10}}>{error}</div>}
          <button className="primary" disabled={!file} onClick={()=>{if(!file){setError("เลือกไฟล์ก่อน");return;}setError("");setStep(2);}}>ถัดไป: ตั้งค่า Checklist →</button>
        </div>
      )}

      {/* Step 2 */}
      {step===2&&(
        <div className="card">
          <p style={{fontSize:13,color:"#555",marginBottom:12}}>เลือก Rule ที่ต้องการตรวจสอบ</p>
          <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>
            {rules.map(r=>(
              <div key={r.id} onClick={()=>!loading&&toggleRule(r.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 13px",border:`0.5px solid ${r.enabled?"#b4b2a9":"#e8e6e0"}`,borderRadius:10,cursor:loading?"default":"pointer"}}>
                <Toggle on={r.enabled} onChange={()=>!loading&&toggleRule(r.id)}/>
                <span style={{fontSize:13,color:r.enabled?"#1a1a18":"#aaa",fontWeight:r.enabled?500:400}}>{r.label}</span>
              </div>
            ))}
          </div>

          {loading&&(
            <div style={{background:"#f8f8f6",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:12,fontWeight:500}}>{PHASE_LBL[phase]}</span>
                <span style={{fontSize:11,color:"#888"}}>{Math.round(progress)}%</span>
              </div>
              <div style={{height:4,background:"#e8e6e0",borderRadius:2,marginBottom:10,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${progress}%`,background:"#1D9E75",borderRadius:2,transition:"width .5s"}}/>
              </div>
              <div style={{display:"flex",gap:16,marginBottom:8}}>
                {["อัปโหลด","ถอดเสียง","วิเคราะห์"].map((lbl,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:5}}>
                    <div style={{width:18,height:18,borderRadius:"50%",background:phase>i+1?"#1D9E75":phase===i+1?"#1a1a18":"#e8e6e0",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {phase>i+1?<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5l2 2 4-4" stroke="white" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      :<div style={{width:5,height:5,borderRadius:"50%",background:phase===i+1?"#fff":"#b4b2a9"}}/>}
                    </div>
                    <span style={{fontSize:11,color:phase===i+1?"#1a1a18":"#aaa",fontWeight:phase===i+1?500:400}}>{lbl}</span>
                  </div>
                ))}
              </div>
              <div style={{fontSize:11,color:"#666"}}>{status}</div>
            </div>
          )}

          {error&&<div style={{background:"#fcebeb",color:"#791f1f",fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10}}>{error}</div>}
          <div style={{display:"flex",gap:8}}>
            <button disabled={loading} onClick={()=>!loading&&setStep(1)} style={{opacity:loading?.4:1}}>← ย้อนกลับ</button>
            {loading
              ?<button onClick={stop} style={{flex:1,background:"#fcebeb",color:"#791f1f",border:"0.5px solid #f09595"}}>หยุด</button>
              :<button className="primary" onClick={run} style={{flex:1,fontSize:13,padding:"8px 18px"}}>เริ่มตรวจสอบ "{file?.name}" →</button>
            }
          </div>
        </div>
      )}

      {/* Step 3 */}
      {step===3&&result&&(
        <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"baseline",gap:10}}>
              <span style={{fontSize:28,fontWeight:500,background:scoreBg,color:scoreColor,padding:"4px 16px",borderRadius:8}}>{result.score}/100</span>
              <span style={{fontSize:13,color:"#555"}}>{result.summary}</span>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={downloadSrt} style={{fontWeight:500}}>⬇ .srt (FCPX)</button>
              <button onClick={()=>{setStep(1);setResult(null);setFile(null);setPhase(0);setProgress(0);setError("");}}>ตรวจใหม่</button>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
            {[{l:"ปัญหาทั้งหมด",v:result.stats.total_issues,c:"#1a1a18"},{l:"Critical",v:result.stats.critical,c:"#e24b4a"},{l:"Warning",v:result.stats.warning,c:"#ba7517"},{l:"Info",v:result.stats.info,c:"#185fa5"}].map(m=>(
              <div key={m.l} className="metric"><div style={{fontSize:10,color:"#888",marginBottom:3}}>{m.l}</div><div style={{fontSize:22,fontWeight:500,color:m.c}}>{m.v}</div></div>
            ))}
          </div>

          <div style={{display:"flex",borderBottom:"0.5px solid #d3d1c7",marginBottom:12}}>
            {[["report","รายงานปัญหา"],["transcript","Transcript"],["srt","Preview .srt"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>setActiveTab(id)} style={{fontSize:12,padding:"7px 14px",border:"none",background:"transparent",borderBottom:`2px solid ${activeTab===id?"#1a1a18":"transparent"}`,color:activeTab===id?"#1a1a18":"#888",fontWeight:activeTab===id?500:400,borderRadius:0}}>{lbl}</button>
            ))}
          </div>

          {activeTab==="report"&&(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {result.issues.length===0?<div style={{textAlign:"center",padding:30,color:"#888"}}>ไม่พบปัญหา</div>
              :result.issues.map((iss,i)=>{
                const bd={critical:"#e24b4a",warning:"#ef9f27",info:"#378add"}[iss.severity];
                const bg={critical:"#fcebeb",warning:"#faeeda",info:"#e6f1fb"}[iss.severity];
                const tc={critical:"#791f1f",warning:"#633806",info:"#0c447c"}[iss.severity];
                return(
                  <div key={i} style={{border:"0.5px solid #d3d1c7",borderLeft:`3px solid ${bd}`,borderRadius:"0 10px 10px 0",padding:"10px 13px",background:"#fff"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <code style={{fontSize:11,background:"#f1efe8",padding:"1px 6px",borderRadius:4,color:"#555"}}>{iss.timestamp}</code>
                      <span style={{background:bg,color:tc,fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:10}}>{iss.severity==="critical"?"Critical":iss.severity==="warning"?"Warning":"Info"}</span>
                      <span style={{fontSize:11,color:"#999"}}>{iss.type}</span>
                    </div>
                    <div style={{fontSize:13,marginBottom:3}}>{iss.description}</div>
                    <div style={{fontSize:11,color:"#666"}}>แนะนำ: {iss.suggestion}</div>
                  </div>
                );
              })}
              {(result.passed||[]).map((p,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#eaf3de",borderRadius:8}}>
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" fill="#1D9E75"/><path d="M4 7l2 2 4-4" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  <span style={{fontSize:12,color:"#27500a"}}>{p}</span>
                </div>
              ))}
            </div>
          )}
          {activeTab==="transcript"&&(
            <div style={{background:"#f1efe8",borderRadius:10,padding:14,fontFamily:"monospace",fontSize:12,lineHeight:2,whiteSpace:"pre-wrap",maxHeight:300,overflowY:"auto"}}>{transcript||"ไม่มี Transcript"}</div>
          )}
          {activeTab==="srt"&&(
            <div>
              <div style={{background:"#12121c",borderRadius:10,padding:14,fontFamily:"monospace",fontSize:11,lineHeight:1.9,color:"#c8c6c0",marginBottom:10,maxHeight:280,overflowY:"auto"}}>
                {result.issues.map((iss,i)=>{const s=tsToSec(iss.timestamp),e=s+4;return(
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{color:"#7F77DD"}}>{i+1}</div>
                    <div style={{color:"#5DCAA5"}}>{fmtSec(s)} --&gt; {fmtSec(e)}</div>
                    <div style={{color:iss.severity==="critical"?"#f09595":iss.severity==="warning"?"#fac775":"#85b7eb"}}>[{iss.type}] {iss.description}</div>
                  </div>
                );})}
              </div>
              <button className="primary" onClick={downloadSrt}>⬇ Download .srt สำหรับ FCPX</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
