// ── Error Boundary ─────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  componentDidCatch(e,info){console.error("Render Error:",e,info);}
  render(){
    if(this.state.err) return (
      <div style={{padding:20,margin:20,background:"#fcebeb",borderRadius:12,border:"0.5px solid #f09595"}}>
        <div style={{fontWeight:500,color:"#791f1f",marginBottom:8}}>เกิดข้อผิดพลาดในการแสดงผล</div>
        <div style={{fontSize:12,color:"#a32d2d",fontFamily:"monospace",marginBottom:12,wordBreak:"break-all"}}>{this.state.err.message}</div>
        <button onClick={()=>this.setState({err:null})}>ลองใหม่</button>
      </div>
    );
    return this.props.children;
  }
}

// ── Helpers ────────────────────────────────────────────────────
function floorSec(ms){return Math.floor(ms/1000);}
function secToHms(s){
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return h>0?`${h}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`:`${m}:${String(sc).padStart(2,"0")}`;
}
function srtTime(s){
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")},000`;
}
function safeSev(s){return ["critical","warning","info"].includes(s)?s:"info";}
function safeStr(s){return typeof s==="string"?s:String(s||"");}
function safeNum(n){return typeof n==="number"&&!isNaN(n)?n:0;}

async function callClaude(antKey,messages,maxTokens=3000){
  const res=await fetch(ANT,{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":antKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages})
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`Claude ${res.status}: ${e?.error?.message||res.statusText}`);}
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
}

function parseJSON(text){
  const m=text.match(/\{[\s\S]*\}/);
  if(!m) throw new Error("ไม่พบ JSON ในผลลัพธ์ของ Claude กรุณาลองใหม่");
  return JSON.parse(m[0]);
}

// ── Extract Frames ─────────────────────────────────────────────
function extractFrames(videoFile,intervalSec,onProgress){
  return new Promise((resolve,reject)=>{
    const video=document.createElement("video");
    video.muted=true;
    const objUrl=URL.createObjectURL(videoFile);
    video.src=objUrl;
    video.onerror=()=>{URL.revokeObjectURL(objUrl);reject(new Error("โหลด Video ไม่ได้ — ลองไฟล์ MP4"));};
    video.onloadedmetadata=()=>{
      const dur=video.duration;
      if(!dur||!isFinite(dur)){URL.revokeObjectURL(objUrl);reject(new Error("ไม่สามารถอ่านความยาว Video ได้"));return;}
      const times=[];
      for(let t=0;t<dur;t+=intervalSec) times.push(parseFloat(t.toFixed(2)));
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");
      const frames=[];
      let idx=0;
      const seek=()=>{
        if(idx>=times.length){URL.revokeObjectURL(objUrl);resolve(frames);return;}
        video.currentTime=times[idx];
      };
      video.onseeked=()=>{
        try{
          const W=Math.min(video.videoWidth,640);
          const scale=W/video.videoWidth;
          canvas.width=W;
          canvas.height=Math.round(video.videoHeight*scale);
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const b64=canvas.toDataURL("image/jpeg",0.5).split(",")[1];
          frames.push({tsSec:times[idx],label:secToHms(times[idx]),b64});
        }catch(e){/* skip bad frame */}
        onProgress&&onProgress(idx+1,times.length);
        idx++;
        setTimeout(seek,20);
      };
      seek();
    };
    video.load();
  });
}

// ── Analyze Frame Batch ────────────────────────────────────────
async function analyzeFrameBatch(antKey,frames,visualRules){
  const content=[];
  frames.forEach((f,i)=>{
    content.push({type:"text",text:`=== Frame index:${i} เวลา:${f.label} ===`});
    content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:f.b64}});
  });
  content.push({type:"text",text:`วิเคราะห์ Frame ด้านบน (index 0–${frames.length-1}) ตามเกณฑ์:
${visualRules.map((r,i)=>`${i+1}. ${r}`).join("\n")}

ตอบ JSON เท่านั้น ห้าม markdown:
{"issues":[{"frame_index":<number 0-${frames.length-1}>,"type":"<ประเภท>","severity":"<critical|warning|info>","description":"<ปัญหาที่พบ>","suggestion":"<คำแนะนำ>"}]}
ถ้าไม่พบปัญหา: {"issues":[]}`});
  try{
    const reply=await callClaude(antKey,[{role:"user",content}],1500);
    const parsed=parseJSON(reply);
    return (parsed.issues||[]).map(iss=>{
      const idx=typeof iss.frame_index==="number"?iss.frame_index:0;
      const frame=frames[Math.min(Math.max(0,idx),frames.length-1)];
      return {
        tsSec:   frame.tsSec,
        timestamp:frame.label,
        source:  "visual",
        type:    safeStr(iss.type)||"Visual",
        severity:safeSev(iss.severity),
        description:safeStr(iss.description),
        suggestion: safeStr(iss.suggestion),
      };
    });
  }catch(e){console.warn("analyzeFrameBatch error:",e.message);return [];}
}

// ── Issue Card (safe render) ───────────────────────────────────
function IssueCard({iss,i}){

        <span style={{fontSize:10,background:isVisual?"#faeeda":"#eeedfe",color:isVisual?"#854F0B":"#3c3489",padding:"1px 6px",borderRadius:8,fontWeight:500}}>{isVisual?"Visual":"Audio"}</span>
        <span style={{fontSize:11,color:"#999"}}>{safeStr(iss.type)}</span>
      </div>
      <div style={{fontSize:13,marginBottom:3}}>{safeStr(iss.description)}</div>
      <div style={{fontSize:11,color:"#666"}}>แนะนำ: {safeStr(iss.suggestion)}</div>

// ── Main App ───────────────────────────────────────────────────
function App(){
  const [asmKey,setAsmKey]=useState("");
  const [antKey,setAntKey]=useState("");
  const [showKeys,setShowKeys]=useState(false);
  const [step,setStep]=useState(1);
  const [criteriaId,setCriteriaId]=useState(null);
  const [visualRuleIds,setVisualRuleIds]=useState(["text","quality","duration","bad","jump"]);
  const [sampleSec,setSampleSec]=useState(5);
  const [extraRules,setExtraRules]=useState([]);
  const [newRule,setNewRule]=useState("");
  const [file,setFile]=useState(null);
  const [script,setScript]=useState("");
  const [phase,setPhase]=useState(0);
  const [progress,setProgress]=useState(0);
  const [status,setStatus]=useState("");
  const [txLines,setTxLines]=useState([]);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [activeTab,setActiveTab]=useState("issues");
  const fileRef=useRef();
  const abortRef=useRef(false);
  const crit=CRITERIA.find(c=>c.id===criteriaId)||null;
  const loading=phase>0;

  const toggleVRule=id=>setVisualRuleIds(rs=>rs.includes(id)?rs.filter(r=>r!==id):[...rs,id]);

  const resetAll=()=>{setStep(1);setResult(null);setFile(null);setCriteriaId(null);setTxLines([]);setExtraRules([]);setPhase(0);setProgress(0);setError("");setStatus("");};

  // ── Pipeline: Transcribe + Correct ────────────────────────
  const runPipeline=async()=>{
    if(!asmKey.trim()){setError("กรุณาใส่ AssemblyAI API Key");return;}
    if(!antKey.trim()){setError("กรุณาใส่ Anthropic API Key");return;}
    if(!file){setError("กรุณาเลือกไฟล์");return;}
    setError("");setTxLines([]);abortRef.current=false;
    try{
      // Phase 1: Upload
      setPhase(1);setProgress(5);setStatus("กำลังอัปโหลดไฟล์...");
      const upRes=await fetch(`${ASMB}/v2/upload`,{method:"POST",headers:{"Authorization":asmKey.trim(),"Content-Type":"application/octet-stream"},body:file});
      if(!upRes.ok){const e=await upRes.json().catch(()=>({}));throw new Error(`Upload Error: ${e?.error||upRes.statusText}`);}
      const {upload_url}=await upRes.json();
      if(abortRef.current) return;

      // Phase 2: Transcribe
      setPhase(2);setProgress(12);setStatus("AssemblyAI ถอดเสียงภาษาไทย...");
      const txRes=await fetch(`${ASMB}/v2/transcript`,{method:"POST",headers:{"Authorization":asmKey.trim(),"Content-Type":"application/json"},
        body:JSON.stringify({audio_url:upload_url,speech_models:["universal-2"],language_code:"th",punctuate:true,format_text:true})});
      if(!txRes.ok){const e=await txRes.json().catch(()=>({}));throw new Error(`Transcription Error: ${e?.error||txRes.statusText}`);}
      const {id:txId}=await txRes.json();
      let txData=null,poll=0;
      while(true){
        if(abortRef.current) return;
        await new Promise(r=>setTimeout(r,3000));poll++;
        const p=await fetch(`${ASMB}/v2/transcript/${txId}`,{headers:{"Authorization":asmKey.trim()}});
        txData=await p.json();
        setProgress(Math.min(12+poll*5,65));
        if(txData.status==="completed") break;
        if(txData.status==="error") throw new Error("AssemblyAI: "+txData.error);
        setStatus(`ถอดเสียงอยู่... (${txData.status})`);
      }

      // Build lines with tsSec
      const DEAD_MS=2000,CHUNK_MS=800;
      let rawLines=[];
      if(txData.words?.length){
        const wds=txData.words;let chunk=[],cs=0;
        for(let i=0;i<wds.length;i++){
          const w=wds[i];
          if(!chunk.length) cs=floorSec(w.start);
          if(i>0){
            const gap=w.start-wds[i-1].end;
            if(gap>=DEAD_MS){
              if(chunk.length){rawLines.push({tsSec:cs,ts:secToHms(cs),text:chunk.join(" ")});chunk=[];}
              const dSec=floorSec(wds[i-1].end);
              rawLines.push({tsSec:dSec,ts:secToHms(dSec),text:`[Dead Air: ${(gap/1000).toFixed(1)}s]`,isDeadAir:true});
              cs=floorSec(w.start);
            } else if(gap>=CHUNK_MS){
              if(chunk.length){rawLines.push({tsSec:cs,ts:secToHms(cs),text:chunk.join(" ")});chunk=[];}
              cs=floorSec(w.start);
            }
          }
          chunk.push(w.text);
          if(chunk.length>=15){rawLines.push({tsSec:cs,ts:secToHms(cs),text:chunk.join(" ")});chunk=[];if(i+1<wds.length)cs=floorSec(wds[i+1].start);}
        }
        if(chunk.length) rawLines.push({tsSec:cs,ts:secToHms(cs),text:chunk.join(" ")});
      } else if(txData.utterances?.length){
        for(let i=0;i<txData.utterances.length;i++){
          const u=txData.utterances[i];
          if(i>0){const gap=u.start-txData.utterances[i-1].end;if(gap>=DEAD_MS){const dSec=floorSec(txData.utterances[i-1].end);rawLines.push({tsSec:dSec,ts:secToHms(dSec),text:`[Dead Air: ${(gap/1000).toFixed(1)}s]`,isDeadAir:true});}}
          const sec=floorSec(u.start);rawLines.push({tsSec:sec,ts:secToHms(sec),text:u.text});
        }
      } else {rawLines=[{tsSec:0,ts:"0:00",text:txData.text||""}];}
      if(abortRef.current) return;

      // Phase 3: Claude แก้คำผิด
      setPhase(3);setProgress(70);setStatus("Claude กำลังแก้คำผิดใน Transcript...");
      const rawText=rawLines.map(l=>`${l.ts}|||${l.text}`).join("\n");
      const correctPrompt=`คุณเป็นผู้เชี่ยวชาญภาษาไทย แก้ไข Transcript จาก AI

กฎ:
1. บรรทัด [Dead Air: Xs] ห้ามแก้หรือลบ
2. แก้เฉพาะคำที่มั่นใจ 100% ว่าผิด
3. ไม่แน่ใจ ออกเสียงไม่ชัด หรือศัพท์เฉพาะ — คงต้นฉบับไว้
4. ห้ามเพิ่ม/ลดบรรทัด รักษา Timestamp เดิม
5. ตอบรูปแบบ timestamp|||ข้อความ เท่านั้น

Transcript:
${rawText}`;
      const corrReply=await callClaude(antKey.trim(),[{role:"user",content:correctPrompt}],4000);
      const corrected=corrReply.split("\n").map(line=>{
        const idx=line.indexOf("|||");if(idx<0) return null;
        const ts=line.slice(0,idx).trim();const text=line.slice(idx+3).trim();
        const orig=rawLines.find(l=>l.ts===ts);
        return {tsSec:orig?orig.tsSec:0,ts,text,isDeadAir:text.startsWith("[Dead Air")};
      }).filter(l=>l&&l.ts&&l.text);

      const finalLines=corrected.length>0?corrected:rawLines;
      setTxLines(finalLines);
      setPhase(0);setProgress(0);setStatus("");setStep(3);
    }catch(e){
      if(!abortRef.current) setError(e.message);
    }finally{
      setPhase(0);setProgress(0);setStatus("");
    }
  };

  // ── Run Full Analysis ──────────────────────────────────────
  const runAnalysis=async()=>{
    if(!antKey.trim()){setError("กรุณาใส่ Anthropic API Key");return;}
    if(txLines.length===0){setError("ไม่มี Transcript");return;}
    setError("");setResult(null);abortRef.current=false;
    try{
      // Phase 4: Audio Analysis
      setPhase(4);setProgress(5);setStatus("Claude วิเคราะห์ Audio / Script...");
      const txText=txLines.map(l=>`${l.ts} ${l.text}`).join("\n");
      const allRules=[...(crit?.rules||[]),...extraRules,"Dead Air (หยุดนิ่งนาน >= 2 วินาที)"].map((r,i)=>`${i+1}. ${r}`).join("\n");
      const audioPrompt=`${crit?.prompt||"คุณเป็น QA ผู้เชี่ยวชาญ"}

Criteria: ${crit?.label||"ทั่วไป"}
${allRules}

Transcript:
${txText}

${script.trim()?`Script ต้นฉบับ:\n${script}`:"ไม่มี Script — ใช้ Domain Knowledge"}

ตอบ JSON เท่านั้น ห้าม markdown:
{"score":<0-100>,"summary":"<สรุป>","issues":[{"timestamp":"<MM:SS>","type":"<ประเภท>","severity":"<critical|warning|info>","description":"<ปัญหา>","suggestion":"<แนะนำ>"}],"suggestions":[{"topic":"<หัวข้อ>","detail":"<แนะนำ>","priority":"<high|medium|low>"}],"passed":["<ผ่าน>"],"stats":{"total_issues":<n>,"critical":<n>,"warning":<n>,"info":<n>}}`;
      const audioReply=await callClaude(antKey.trim(),[{role:"user",content:audioPrompt}],3000);
      const audioRaw=parseJSON(audioReply);
      if(abortRef.current) return;

      // Normalize audio issues — tsSec จาก Transcript lines เดิม
      const audioIssues=(audioRaw.issues||[]).map(iss=>{
        const ts=safeStr(iss.timestamp)||"0:00";
        const orig=txLines.find(l=>l.ts===ts);
        const tsSec=orig?orig.tsSec:0;
        return {tsSec,timestamp:ts,source:"audio",type:safeStr(iss.type)||"Audio",severity:safeSev(iss.severity),description:safeStr(iss.description),suggestion:safeStr(iss.suggestion)};
      });
      setProgress(40);

      // Phase 5: Visual Analysis
      let visualIssues=[];
      const isVideo=file?.type?.startsWith("video/");
      const activeVRules=VISUAL_CRITERIA.filter(c=>visualRuleIds.includes(c.id)).map(c=>`${c.label}: ${c.desc}`);
      if(isVideo&&activeVRules.length>0){
        setPhase(5);setProgress(0);setStatus(`ดึง Frame ทุก ${sampleSec} วิ...`);
        let frames=[];
        try{
          frames=await extractFrames(file,sampleSec,(done,total)=>{
            setProgress(Math.round(done/total*40));
            setStatus(`Frame ${done}/${total}...`);
          });
        }catch(e){setError("ดึง Frame ไม่สำเร็จ: "+e.message);}

        if(!abortRef.current&&frames.length>0){
          const batches=[];
          for(let i=0;i<frames.length;i+=BATCH_SIZE) batches.push(frames.slice(i,i+BATCH_SIZE));
          for(let bi=0;bi<batches.length;bi++){
            if(abortRef.current) break;
            setProgress(40+Math.round(((bi+1)/batches.length)*58));
            setStatus(`Claude Vision Batch ${bi+1}/${batches.length}...`);
            const bIssues=await analyzeFrameBatch(antKey.trim(),batches[bi],activeVRules);
            visualIssues.push(...bIssues);
            await new Promise(r=>setTimeout(r,300));
          }
        }
      }
      if(abortRef.current) return;

      // Combine + sort by tsSec
      const allIssues=[...audioIssues,...visualIssues].sort((a,b)=>a.tsSec-b.tsSec);
      const stats={
        total_issues:allIssues.length,
        critical:allIssues.filter(i=>i.severity==="critical").length,
        warning:allIssues.filter(i=>i.severity==="warning").length,
        info:allIssues.filter(i=>i.severity==="info").length,
      };
      // Build final result — all fields have safe defaults
      const finalResult={
        score:    safeNum(audioRaw.score),
        summary:  safeStr(audioRaw.summary),
        issues:   allIssues,
        suggestions:(audioRaw.suggestions||[]).map(s=>({topic:safeStr(s.topic),detail:safeStr(s.detail),priority:["high","medium","low"].includes(s.priority)?s.priority:"low"})),
        passed:   (audioRaw.passed||[]).map(safeStr),
        stats,
        audio_count:audioIssues.length,
        visual_count:visualIssues.length,
      };
      setResult(finalResult);
      setStep(4);  // set step AFTER result — both in same synchronous block
    }catch(e){
      if(!abortRef.current) setError(e.message||"เกิดข้อผิดพลาด กรุณาลองใหม่");
    }finally{
      setPhase(0);setProgress(0);setStatus("");
    }
  };

  const downloadSrt=()=>{
    if(!result) return;
    const lines=result.issues.map((iss,i)=>{
      const s=safeNum(iss.tsSec);const e=s+4;
      return`${i+1}\n${srtTime(s)} --> ${srtTime(e)}\n[${(iss.source||"").toUpperCase()}][${safeStr(iss.type)}] ${safeStr(iss.description)}`;
    });
    const blob=new Blob([lines.join("\n\n")],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="verilearn_markers.srt";a.click();URL.revokeObjectURL(url);
  };

  const downloadReport=()=>{
    if(!result) return;
    const lines=["VeriLearn QA Report v7",`Criteria: ${crit?.label||"ไม่ระบุ"}`,`Score: ${result.score}/100`,`Summary: ${result.summary}`,`Audio: ${result.audio_count}  Visual: ${result.visual_count}`,"",
      "=== Issues ===",
      ...result.issues.map(i=>`[${i.timestamp}][${(i.source||"").toUpperCase()}][${i.severity.toUpperCase()}] ${i.type}\n  ${i.description}\n  แนะนำ: ${i.suggestion}`),
      "","=== Suggestions ===",
      ...result.suggestions.map(s=>`[${s.priority.toUpperCase()}] ${s.topic}\n  ${s.detail}`),
      "","=== Passed ===",
      ...result.passed.map(p=>`✓ ${p}`),
      "","=== Transcript ===",
      ...txLines.map(l=>`${l.ts} ${l.text}`),
    ];
    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="verilearn_report.txt";a.click();URL.revokeObjectURL(url);
  };

  const PHASE_INFO=[null,
    {label:"อัปโหลดไฟล์",color:"#1D9E75"},
    {label:"AssemblyAI ถอดเสียง",color:"#378ADD"},
    {label:"Claude แก้คำผิด",color:"#7F77DD"},
    {label:"Claude วิเคราะห์ Audio",color:"#534AB7"},
    {label:"Claude Vision วิเคราะห์ภาพ",color:"#D85A30"},
  ];

  const scoreBg=result?(result.score>=80?"#eaf3de":result.score>=60?"#faeeda":"#fcebeb"):"#f1efe8";
  const scoreColor=result?(result.score>=80?"#27500a":result.score>=60?"#633806":"#791f1f"):"#888";

  return(

          <div style={{width:10,height:10,borderRadius:"50%",background:"#5DCAA5"}}/>

          {crit&&<span style={{fontSize:10,background:crit.bg,color:crit.color,padding:"1px 7px",borderRadius:10,fontWeight:500,border:`0.5px solid ${crit.border}`}}>{crit.label}</span>}
        </div>

          );})}
        </div>
      </div>

      {/* API Keys */}
      <div className="card" style={{marginBottom:14}}>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>

            <input type={showKeys?"text":"password"} value={antKey} onChange={e=>setAntKey(e.target.value)} placeholder="sk-ant-api03-..." style={{fontFamily:"monospace"}}/>

          <a href="https://console.anthropic.com/settings/keys" target="_blank">Anthropic Key ↗</a>

      {/* Progress */}

              <div style={{fontSize:11,fontWeight:500,color:"#555",marginBottom:6}}>เพิ่ม Audio Rule เอง</div>
              <div style={{display:"flex",gap:6}}>
                <input type="text" value={newRule} onChange={e=>setNewRule(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newRule.trim()){setExtraRules(r=>[...r,newRule.trim()]);setNewRule("");}}} placeholder="พิมพ์แล้วกด Enter..."/>
                <button onClick={()=>{if(newRule.trim()){setExtraRules(r=>[...r,newRule.trim()]);setNewRule("");}}} style={{flexShrink:0}}>+ เพิ่ม</button>
              </div>
              {extraRules.map((r,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"4px 8px",background:"#f1efe8",borderRadius:6,marginTop:5,fontSize:11}}>
                  <span>{r}</span>
                  <button onClick={()=>setExtraRules(rs=>rs.filter((_,j)=>j!==i))} style={{fontSize:10,padding:"1px 6px",color:"#e24b4a",border:"0.5px solid #f09595",borderRadius:4}}>ลบ</button>
                </div>
              ))}
            </div>
          )}
          <button className="primary" disabled={!criteriaId} onClick={()=>setStep(2)}>ถัดไป: อัปโหลด Video →</button>
        </div>
      )}

      {/* ── Step 2: Upload ── */}
      {step===2&&(
        <div className="card">
          <p style={{fontSize:13,color:"#555",marginBottom:12}}>อัปโหลดไฟล์ — ระบบถอดเสียง แก้คำผิด และวิเคราะห์ภาพอัตโนมัติ</p>
          <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:14,padding:"8px 12px",background:"#f8f8f6",borderRadius:8,flexWrap:"wrap",rowGap:6}}>
            {[{t:"AssemblyAI",s:"ถอดเสียง",c:"#1D9E75"},{t:"Claude",s:"แก้คำผิด",c:"#7F77DD"},{t:"คุณ",s:"ตรวจสอบ",c:"#BA7517"},{t:"Claude",s:"Audio QA",c:"#534AB7"},{t:"Claude Vision",s:"Visual QA",c:"#D85A30"}].map((item,i)=>(
              <React.Fragment key={i}>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:11,fontWeight:500,color:item.c}}>{item.t}</div>
                  <div style={{fontSize:9,color:"#888"}}>{item.s}</div>
                </div>
                {i<4&&<span style={{color:"#d3d1c7",fontSize:12}}>→</span>}
              </React.Fragment>
            ))}
          </div>
          <div onClick={()=>fileRef.current?.click()} style={{border:`1.5px dashed ${file?"#1D9E75":"#d3d1c7"}`,borderRadius:10,padding:"22px 16px",textAlign:"center",cursor:"pointer",background:file?"#e1f5ee":"#f8f8f6",marginBottom:12}}>
            <input ref={fileRef} type="file" accept="video/*,audio/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith("video/")&&!f.type.startsWith("audio/")){setError("รองรับเฉพาะ Video/Audio");return;}setFile(f);setError("");}} style={{display:"none"}}/>
            {file?(<div>
              <div style={{width:28,height:28,borderRadius:"50%",background:"#1D9E75",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 6px"}}><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 6l3 3 6-6" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
              <div style={{fontSize:13,fontWeight:500,color:"#085041"}}>{file.name}</div>
              <div style={{fontSize:11,color:"#0f6e56",marginTop:1}}>{(file.size/1024/1024).toFixed(1)} MB · คลิกเพื่อเปลี่ยน</div>

              <div style={{fontSize:13,fontWeight:500,color:"#888",marginBottom:2}}>คลิกเพื่อเลือกไฟล์</div>
              <div style={{fontSize:11,color:"#aaa"}}>MP4, MOV, MP3, M4A, WAV</div>
            </div>)}
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>Script ต้นฉบับ <span style={{background:"#e6f1fb",color:"#0c447c",padding:"0 5px",borderRadius:3,fontSize:10}}>ไม่บังคับ</span></div>
            <textarea value={script} onChange={e=>setScript(e.target.value)} placeholder="วาง Script ต้นฉบับ (ถ้ามี)..." style={{height:70,lineHeight:1.6,resize:"vertical",fontFamily:"monospace",fontSize:12}}/>
          </div>
          {error&&<div style={{background:"#fcebeb",color:"#791f1f",fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10}}>{error}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>!loading&&setStep(1)} disabled={loading}>← ย้อนกลับ</button>
            <button className="primary" onClick={runPipeline} disabled={loading||!file} style={{flex:1,fontSize:13,padding:"8px"}}>ถอดเสียงและแก้คำผิดอัตโนมัติ →</button>
          </div>
        </div>
      )}

      {/* ── Step 3: Transcript Review ── */}
      {step===3&&(
        <div className="card">
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:10}}>
            <div>
              <div style={{fontSize:14,fontWeight:500,marginBottom:3}}>ตรวจสอบ Script (Claude แก้แล้ว)</div>

            <span style={{fontSize:10,background:"#eeedfe",color:"#3c3489",padding:"2px 8px",borderRadius:8,fontWeight:500,flexShrink:0}}>{txLines.length} บรรทัด</span>
          </div>
          <div style={{background:"#eeedfe",borderRadius:8,padding:"7px 11px",marginBottom:8,fontSize:11,color:"#3c3489"}}>
            บรรทัดสีส้ม = Dead Air · แก้ข้อความได้โดยตรง ห้ามแก้เวลาซ้ายมือ
          </div>
          <div style={{border:"0.5px solid #d3d1c7",borderRadius:10,overflow:"hidden",marginBottom:10,maxHeight:360,overflowY:"auto"}}>
            <div style={{display:"flex",background:"#f1efe8",borderBottom:"0.5px solid #d3d1c7"}}>
              <div style={{width:56,padding:"5px 8px",fontSize:10,color:"#888",fontWeight:500}}>เวลา</div>
              <div style={{flex:1,padding:"5px 10px",fontSize:10,color:"#888",fontWeight:500}}>ข้อความ (แก้ได้)</div>
            </div>
            {txLines.map((line,i)=>(
              <div key={i} style={{display:"flex",borderBottom:i<txLines.length-1?"0.5px solid #f1efe8":"none"}}>
                <div style={{width:56,flexShrink:0,padding:"7px 8px",background:line.isDeadAir?"#f5d9a0":"#f8f8f6",borderRight:"0.5px solid #e8e6e0",fontFamily:"monospace",fontSize:11,color:"#888",display:"flex",alignItems:"center"}}>{line.ts}</div>
                <input type="text" value={line.text} onChange={e=>{const nl=[...txLines];nl[i]={...nl[i],text:e.target.value};setTxLines(nl);}} style={{flex:1,border:"none",borderRadius:0,padding:"7px 10px",fontSize:12,background:line.isDeadAir?"#faeeda":i%2===0?"#fff":"#fafaf8",color:line.isDeadAir?"#854F0B":"#1a1a18",fontWeight:line.isDeadAir?500:400}}/>
              </div>
            ))}
          </div>
          {error&&<div style={{background:"#fcebeb",color:"#791f1f",fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10}}>{error}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setStep(2)} disabled={loading}>← ย้อนกลับ</button>
            <button className="primary" onClick={runAnalysis} disabled={loading||txLines.length===0} style={{flex:1,fontSize:13,padding:"8px"}}>
              {loading?status:`วิเคราะห์ Audio + Visual (${crit?.label||""}) →`}

      {/* ── Step 4: Results ── */}
      {step===4&&result&&(
        <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"baseline",gap:10}}>
              <span style={{fontSize:28,fontWeight:500,background:scoreBg,color:scoreColor,padding:"4px 16px",borderRadius:8}}>{result.score}/100</span>

                  {result.passed.map((p,i)=>(
                    <div key={i} style={{display:"flex",gap:8,padding:"6px 10px",background:"#eaf3de",borderRadius:8,marginBottom:4,alignItems:"center"}}>
                      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5.5" fill="#1D9E75"/><path d="M3.5 6.5l2 2 4-4" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      <span style={{fontSize:12,color:"#27500a"}}>{p}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeTab==="suggestions"&&(
            <div>
              {result.suggestions.length===0&&<div style={{textAlign:"center",padding:30,color:"#888"}}>ไม่มี Suggestion</div>}
              {result.suggestions.map((s,i)=>{
                const pc={high:"#e24b4a",medium:"#ba7517",low:"#534AB7"}[s.priority]||"#888";
                const pb={high:"#fcebeb",medium:"#faeeda",low:"#eeedfe"}[s.priority]||"#f1efe8";
                const pt={high:"#791f1f",medium:"#633806",low:"#3c3489"}[s.priority]||"#555";
                return(
                  <div key={i} style={{border:"0.5px solid #d3d1c7",borderLeft:`3px solid ${pc}`,borderRadius:"0 10px 10px 0",padding:"10px 13px",marginBottom:6}}>
                    <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:5}}>
                      <span style={{background:pb,color:pt,fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:10}}>{s.priority==="high"?"สำคัญสูง":s.priority==="medium"?"สำคัญกลาง":"แนะนำ"}</span>
                      <span style={{fontSize:12,fontWeight:500}}>{s.topic}</span>
                    </div>
                    <div style={{fontSize:12,color:"#555",lineHeight:1.6}}>{s.detail}</div>
                  </div>
                );
              })}
            </div>
          )}

          {activeTab==="transcript"&&(
            <div style={{border:"0.5px solid #d3d1c7",borderRadius:10,overflow:"hidden",maxHeight:320,overflowY:"auto"}}>
              {txLines.map((l,i)=>(
                <div key={i} style={{display:"flex",borderBottom:i<txLines.length-1?"0.5px solid #f1efe8":"none"}}>
                  <div style={{width:56,flexShrink:0,padding:"6px 8px",background:l.isDeadAir?"#f5d9a0":"#f1efe8",fontFamily:"monospace",fontSize:11,color:"#888"}}>{l.ts}</div>
                  <div style={{flex:1,padding:"6px 10px",fontSize:12,background:l.isDeadAir?"#faeeda":i%2===0?"#fff":"#fafaf8",color:l.isDeadAir?"#854F0B":"#1a1a18"}}>{l.text}</div>
                </div>
              ))}
            </div>
          )}

          {activeTab==="srt"&&(
            <div>
              <div style={{background:"#12121c",borderRadius:10,padding:14,fontFamily:"monospace",fontSize:11,lineHeight:1.9,color:"#c8c6c0",marginBottom:10,maxHeight:280,overflowY:"auto"}}>
                {result.issues.length===0?<span style={{color:"#5DCAA5"}}>ไม่มีปัญหา</span>
                :result.issues.map((iss,i)=>{
                  const s=safeNum(iss.tsSec);const e=s+4;
                  return(
                    <div key={i} style={{marginBottom:12}}>
                      <div style={{color:"#7F77DD"}}>{i+1}</div>
                      <div style={{color:"#5DCAA5"}}>{srtTime(s)} --&gt; {srtTime(e)}</div>
                      <div style={{color:iss.severity==="critical"?"#f09595":iss.severity==="warning"?"#fac775":"#85b7eb"}}>[{(iss.source||"").toUpperCase()}][{safeStr(iss.type)}] {safeStr(iss.description)}</div>
                    </div>
                  );
                })}
              </div>
              <button className="primary" onClick={downloadSrt}>⬇ Download .srt สำหรับ FCPX</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
</body>
</html>
