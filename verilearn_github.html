<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriLearn — Video QA</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a18;min-height:100vh;padding:24px 16px}
  textarea,input[type=text],input[type=password]{width:100%;border:0.5px solid #d3d1c7;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s}
  textarea:focus,input:focus{border-color:#888}
  button{border:0.5px solid #d3d1c7;border-radius:8px;padding:7px 14px;font-size:12px;font-family:inherit;background:#fff;color:#1a1a18;cursor:pointer;transition:background .15s}
  button:hover{background:#f1efe8}
  button.primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
  button.primary:hover{background:#333}
  button:disabled{opacity:.4;cursor:default}
  .card{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:16px}
  .badge-crit{background:#fcebeb;color:#791f1f;border:0.5px solid #f09595;font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px}
  .badge-warn{background:#faeeda;color:#633806;border:0.5px solid #fac775;font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px}
  .badge-info{background:#e6f1fb;color:#0c447c;border:0.5px solid #85b7eb;font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px}
  .metric{background:#f1efe8;border-radius:8px;padding:10px 12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const RULES = [
  { id:"spelling",  label:"ตรวจคำผิด / สะกดผิด",      desc:"ตรวจหาคำสะกดผิดในภาษาไทย",                  enabled:true  },
  { id:"content",   label:"เนื้อหาตรงกับ Script",       desc:"เปรียบเทียบ Transcript กับ Script ที่กำหนด", enabled:true  },
  { id:"complete",  label:"เนื้อหาครบถ้วน",             desc:"ตรวจว่ามีหัวข้อสำคัญขาดหายไปหรือไม่",       enabled:true  },
  { id:"structure", label:"โครงสร้างการนำเสนอ",         desc:"บทนำ เนื้อหา สรุป ครบหรือไม่",              enabled:true  },
  { id:"bad",       label:"เนื้อหาไม่เหมาะสม",          desc:"ตรวจหาคำหรือเนื้อหาที่ไม่เหมาะสม",          enabled:false },
];

const SAMPLE_TRANSCRIPT = `00:00:05 สวัสดีครับ วันนี้เราจะมาเรียนรู้เรื่องปฎิกิริยาเคมีพื้นฐาน
00:00:14 ปฏิกิริยาเคมีคือกระบวนการที่สารตั้งต้นเปลี่ยนแปลงไปเป็นสารผลิตภัณท์
00:00:28 ตัวอย่างที่เราเห็นในชีวิตประจำวันเช่น การเผาไหม้ การสนิมเหล็ก
00:01:02 สมการเคมีที่สำคัญคือ H2O บวก CO2 ให้ผลเป็น H2CO3
00:01:20 ในการทดลองครั้งนี้เราจะใช้กรดเกลือความเข้มข้น 6.02×10²²
00:01:45 ขอให้ทุกคนจำค่าคงที่ของอาโวกาโดร ซึ่งมีค่าเท่ากับ 6.022×10²³
00:02:10 สรุปคือปฏิกิริยาเคมีมีหลายประเภทและสำคัญมากในชีวิตประจำวัน`;

const SAMPLE_SCRIPT = `00:00:05 สวัสดีครับ วันนี้เราจะมาเรียนรู้เรื่องปฏิกิริยาเคมีพื้นฐาน
00:00:14 ปฏิกิริยาเคมีคือกระบวนการที่สารตั้งต้นเปลี่ยนแปลงไปเป็นสารผลิตภัณฑ์
00:00:28 ตัวอย่างที่เราเห็นในชีวิตประจำวันเช่น การเผาไหม้ การสนิมเหล็ก และการหายใจ
00:01:02 สมการเคมีที่สำคัญคือ H2O บวก CO2 ให้ผลเป็น H2CO3
00:01:20 ในการทดลองครั้งนี้เราจะใช้กรดเกลือความเข้มข้น 6.022×10²³ mol
00:01:45 ขอให้ทุกคนจำค่าคงที่ของอาโวกาโดร ซึ่งมีค่าเท่ากับ 6.022×10²³
00:02:10 สรุปคือปฏิกิริยาเคมีมีหลายประเภทและมีความสำคัญอย่างยิ่งในชีวิตประจำวัน`;

function Toggle({ on, onChange }) {
  return (
    <div onClick={onChange} style={{width:32,height:18,borderRadius:9,background:on?"#1D9E75":"#b4b2a9",position:"relative",cursor:"pointer",flexShrink:0,transition:"background .2s"}}>
      <div style={{position:"absolute",top:2,left:on?14:2,width:14,height:14,borderRadius:"50%",background:"#fff",transition:"left .2s"}}/>
    </div>
  );
}

function tsToSec(ts) {
  const p = ts.trim().split(":").map(Number);
  return p.length===2 ? p[0]*60+p[1] : p[0]*3600+p[1]*60+p[2];
}
function fmtSec(s) {
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")},000`;
}

function App() {
  const [apiKey, setApiKey]       = useState("");
  const [step, setStep]           = useState(1);
  const [transcript, setTx]       = useState("");
  const [script, setSc]           = useState("");
  const [rules, setRules]         = useState(RULES);
  const [loading, setLoading]     = useState(false);
  const [loadMsg, setLoadMsg]     = useState("");
  const [result, setResult]       = useState(null);
  const [error, setError]         = useState("");
  const [activeTab, setActiveTab] = useState("report");
  const [showKey, setShowKey]     = useState(false);

  const toggleRule = id => setRules(r => r.map(x => x.id===id ? {...x,enabled:!x.enabled} : x));

  const analyze = async () => {
    if (!apiKey.trim()) { setError("กรุณาใส่ Anthropic API Key ก่อน"); return; }
    if (!transcript.trim()) { setError("กรุณาใส่ Transcript ก่อน"); return; }
    setError(""); setLoading(true); setResult(null);
    const msgs = ["กำลังวิเคราะห์ด้วย Claude AI...","ตรวจสอบคำผิดภาษาไทย...","เปรียบเทียบ Script...","สร้างรายงาน..."];
    let mi = 0; setLoadMsg(msgs[0]);
    const iv = setInterval(() => { mi=(mi+1)%msgs.length; setLoadMsg(msgs[mi]); }, 1800);
    const enabledRules = rules.filter(r=>r.enabled).map(r=>r.label).join(", ");
    const hasScript = script.trim().length > 0;
    const prompt = `คุณคือ AI ระบบตรวจสอบคุณภาพสื่อ E-Learning ภาษาไทย

Transcript จาก Video:
${transcript}

${hasScript ? `Script ต้นฉบับสำหรับเปรียบเทียบ:\n${script}` : "ไม่มี Script ต้นฉบับ"}

Checklist ที่ต้องตรวจ: ${enabledRules}

วิเคราะห์และตอบเป็น JSON เท่านั้น ห้ามมี markdown หรือข้อความอื่น:
{"score":<0-100>,"summary":"<สรุป 1-2 ประโยค>","issues":[{"timestamp":"<HH:MM:SS>","type":"<คำผิด|เนื้อหา|โครงสร้าง|ข้อมูลผิด|เนื้อหาขาด>","severity":"<critical|warning|info>","description":"<อธิบายปัญหา>","suggestion":"<คำแนะนำ>"}],"passed":["<สิ่งที่ผ่าน>"],"stats":{"total_issues":<n>,"critical":<n>,"warning":<n>,"info":<n>}}`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey.trim(),
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:2000, messages:[{role:"user",content:prompt}] })
      });
      clearInterval(iv);
      if (!res.ok) {
        const e = await res.json().catch(()=>({}));
        throw new Error(`API ${res.status}: ${e?.error?.message||res.statusText}`);
      }
      const data = await res.json();
      const raw = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
      const m = raw.match(/\{[\s\S]*\}/);
      if (!m) throw new Error("ไม่พบ JSON ในผลลัพธ์ กรุณาลองใหม่");
      const parsed = JSON.parse(m[0]);
      if (!parsed.issues||parsed.score===undefined) throw new Error("ข้อมูลไม่ครบ กรุณาลองใหม่");
      setResult(parsed); setStep(3);
    } catch(e) {
      clearInterval(iv);
      setError("วิเคราะห์ไม่สำเร็จ: " + e.message);
    } finally { setLoading(false); }
  };

  const downloadSrt = () => {
    const lines = result.issues.map((iss,i) => {
      const s = tsToSec(iss.timestamp); const e = s+4;
      return `${i+1}\n${fmtSec(s)} --> ${fmtSec(e)}\n[${iss.type}] ${iss.description}`;
    });
    const blob = new Blob([lines.join("\n\n")],{type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="verilearn_markers.srt"; a.click();
    URL.revokeObjectURL(url);
  };

  const scoreBg = result ? (result.score>=80?"#eaf3de":result.score>=60?"#faeeda":"#fcebeb") : "#f1efe8";
  const scoreColor = result ? (result.score>=80?"#27500a":result.score>=60?"#633806":"#791f1f") : "#888";

  return (
    <div style={{maxWidth:740,margin:"0 auto"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:"#5DCAA5"}}/>
          <span style={{fontSize:16,fontWeight:500}}>VeriLearn</span>
          <span style={{fontSize:10,background:"#e6f1fb",color:"#0c447c",padding:"1px 7px",borderRadius:10,fontWeight:500}}>Beta</span>
        </div>
        <div style={{display:"flex",gap:6}}>
          {[["1 · ข้อมูล",1],["2 · Checklist",2],["3 · ผลลัพธ์",3]].map(([lbl,s])=>(
            <button key={s} onClick={()=>s<=step&&setStep(s)} style={{fontSize:11,padding:"4px 12px",background:step===s?"#1a1a18":"transparent",color:step===s?"#fff":"#888",borderColor:step===s?"#1a1a18":"#d3d1c7",borderRadius:20,opacity:s>step?.4:1,cursor:s>step?"default":"pointer"}}>{lbl}</button>
          ))}
        </div>
      </div>

      {/* API Key bar */}
      <div className="card" style={{marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:12,color:"#888",flexShrink:0}}>API Key</span>
        <input type={showKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-api03-..." style={{flex:1,fontFamily:"monospace",fontSize:12}}/>
        <button onClick={()=>setShowKey(v=>!v)} style={{fontSize:11,padding:"4px 10px",flexShrink:0}}>{showKey?"ซ่อน":"แสดง"}</button>
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer" style={{fontSize:11,color:"#185fa5",flexShrink:0,textDecoration:"none"}}>ขอ Key ↗</a>
      </div>
      <div style={{fontSize:11,color:"#888",marginTop:-10,marginBottom:16,paddingLeft:4}}>* API Key ไม่ถูกเก็บบันทึก — ใช้เฉพาะใน Session นี้เท่านั้น</div>

      {/* Step 1 */}
      {step===1 && (
        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <span style={{fontSize:13,color:"#555"}}>วาง Transcript (พร้อม Timestamp) และ Script ต้นฉบับ</span>
            <button onClick={()=>{setTx(SAMPLE_TRANSCRIPT);setSc(SAMPLE_SCRIPT)}} style={{fontSize:11,padding:"4px 10px"}}>โหลดตัวอย่าง →</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div>
              <div style={{fontSize:11,color:"#888",marginBottom:5}}>TRANSCRIPT <span style={{background:"#fcebeb",color:"#791f1f",padding:"1px 5px",borderRadius:4,fontSize:10}}>จำเป็น</span></div>
              <textarea value={transcript} onChange={e=>setTx(e.target.value)} placeholder={"00:00:05 สวัสดีครับ...\n00:00:14 ปฏิกิริยา..."} style={{height:200,fontFamily:"monospace",lineHeight:1.6}}/>
            </div>
            <div>
              <div style={{fontSize:11,color:"#888",marginBottom:5}}>SCRIPT ต้นฉบับ <span style={{background:"#e6f1fb",color:"#0c447c",padding:"1px 5px",borderRadius:4,fontSize:10}}>แนะนำ</span></div>
              <textarea value={script} onChange={e=>setSc(e.target.value)} placeholder={"00:00:05 สวัสดีครับ...\n(ถ้าไม่มีจะตรวจแค่คำผิด)"} style={{height:200,fontFamily:"monospace",lineHeight:1.6}}/>
            </div>
          </div>
          {error && <div style={{background:"#fcebeb",color:"#791f1f",fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10}}>{error}</div>}
          <button className="primary" onClick={()=>{ if(!transcript.trim()){setError("กรุณาใส่ Transcript ก่อน");return;} setError("");setStep(2); }}>ถัดไป: ตั้งค่า Checklist →</button>
        </div>
      )}

      {/* Step 2 */}
      {step===2 && (
        <div className="card">
          <p style={{fontSize:13,color:"#555",marginBottom:14}}>เลือก Rule ที่ต้องการให้ AI ตรวจสอบ</p>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
            {rules.map(r=>(
              <div key={r.id} onClick={()=>toggleRule(r.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",border:`0.5px solid ${r.enabled?"#b4b2a9":"#e8e6e0"}`,borderRadius:10,cursor:"pointer",background:"#fff"}}>
                <Toggle on={r.enabled} onChange={()=>toggleRule(r.id)}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:500,color:r.enabled?"#1a1a18":"#aaa"}}>{r.label}</div>
                  <div style={{fontSize:11,color:"#999",marginTop:1}}>{r.desc}</div>
                </div>
              </div>
            ))}
          </div>
          {error && <div style={{background:"#fcebeb",color:"#791f1f",fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10}}>{error}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setStep(1)}>← ย้อนกลับ</button>
            <button className="primary" onClick={analyze} disabled={loading}>
              {loading ? loadMsg : "เริ่มวิเคราะห์ด้วย Claude AI →"}
            </button>
          </div>
        </div>
      )}

      {/* Step 3 */}
      {step===3 && result && (
        <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"baseline",gap:10}}>
              <span style={{fontSize:28,fontWeight:500,background:scoreBg,color:scoreColor,padding:"4px 16px",borderRadius:8}}>{result.score}/100</span>
              <span style={{fontSize:13,color:"#555"}}>{result.summary}</span>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={downloadSrt} style={{fontWeight:500}}>⬇ Download .srt</button>
              <button onClick={()=>{setStep(1);setResult(null);setError("");}}>ตรวจใหม่</button>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:8,marginBottom:16}}>
            {[{l:"ปัญหาทั้งหมด",v:result.stats.total_issues,c:"#1a1a18"},{l:"Critical",v:result.stats.critical,c:"#e24b4a"},{l:"Warning",v:result.stats.warning,c:"#ba7517"},{l:"Info",v:result.stats.info,c:"#185fa5"}].map(m=>(
              <div key={m.l} className="metric"><div style={{fontSize:10,color:"#888",marginBottom:3}}>{m.l}</div><div style={{fontSize:22,fontWeight:500,color:m.c}}>{m.v}</div></div>
            ))}
          </div>

          <div style={{display:"flex",gap:0,marginBottom:14,borderBottom:"0.5px solid #d3d1c7"}}>
            {[["report","รายงานปัญหา"],["passed","ผ่านการตรวจ"],["srt","Preview .srt"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>setActiveTab(id)} style={{fontSize:12,padding:"7px 16px",border:"none",background:"transparent",borderBottom:`2px solid ${activeTab===id?"#1a1a18":"transparent"}`,color:activeTab===id?"#1a1a18":"#888",fontWeight:activeTab===id?500:400,borderRadius:0,cursor:"pointer"}}>{lbl}</button>
            ))}
          </div>

          {activeTab==="report" && (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {result.issues.length===0
                ? <div style={{textAlign:"center",padding:30,color:"#888"}}>ไม่พบปัญหา</div>
                : result.issues.map((iss,i)=>(
                  <div key={i} style={{border:"0.5px solid #d3d1c7",borderLeft:`3px solid ${iss.severity==="critical"?"#e24b4a":iss.severity==="warning"?"#ef9f27":"#378add"}`,borderRadius:"0 10px 10px 0",padding:"11px 14px",background:"#fff"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <code style={{fontSize:11,background:"#f1efe8",padding:"1px 6px",borderRadius:4,color:"#555"}}>{iss.timestamp}</code>
                      <span className={`badge-${iss.severity}`}>{iss.severity==="critical"?"Critical":iss.severity==="warning"?"Warning":"Info"}</span>
                      <span style={{fontSize:11,color:"#999"}}>{iss.type}</span>
                    </div>
                    <div style={{fontSize:13,color:"#1a1a18",marginBottom:4}}>{iss.description}</div>
                    <div style={{fontSize:11,color:"#666"}}>แนะนำ: {iss.suggestion}</div>
                  </div>
                ))}
            </div>
          )}

          {activeTab==="passed" && (
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {(result.passed||[]).map((p,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"#eaf3de",borderRadius:8}}>
                  <div style={{width:16,height:16,borderRadius:"50%",background:"#1D9E75",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4l2 2 4-4" stroke="white" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <span style={{fontSize:12,color:"#27500a"}}>{p}</span>
                </div>
              ))}
            </div>
          )}

          {activeTab==="srt" && (
            <div>
              <div style={{background:"#12121c",borderRadius:10,padding:14,fontFamily:"monospace",fontSize:11,lineHeight:1.9,color:"#c8c6c0",marginBottom:10}}>
                {result.issues.map((iss,i)=>{
                  const s=tsToSec(iss.timestamp); const e=s+4;
                  return (
                    <div key={i} style={{marginBottom:12}}>
                      <div style={{color:"#7F77DD"}}>{i+1}</div>
                      <div style={{color:"#5DCAA5"}}>{fmtSec(s)} --&gt; {fmtSec(e)}</div>
                      <div style={{color:iss.severity==="critical"?"#f09595":iss.severity==="warning"?"#fac775":"#85b7eb"}}>[{iss.type}] {iss.description}</div>
                    </div>
                  );
                })}
              </div>
              <button onClick={downloadSrt} className="primary" style={{fontSize:12,padding:"7px 16px"}}>⬇ Download .srt สำหรับ FCPX</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
